<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Dark Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#border)" stroke-width="2.2"/>

  <!-- 3D Graphics Wireframe Cage (OpenGL / Vulkan Topology) -->
  <polygon points="32,6 56,19 32,32 8,19" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="8" y1="19" x2="8" y2="45" stroke="#1e293b" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="32" y1="32" x2="32" y2="58" stroke="#1e293b" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="56" y1="19" x2="56" y2="45" stroke="#1e293b" stroke-width="1.2" stroke-opacity="0.7"/>
  <polygon points="8,45 32,58 56,45" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Luminous Vertex Nodes -->
  <circle cx="32" cy="6" r="2" fill="#f59e0b"/>
  <circle cx="8" cy="19" r="2" fill="#38bdf8"/>
  <circle cx="56" cy="19" r="2" fill="#f59e0b"/>
  <circle cx="8" cy="45" r="1.6" fill="#1e293b"/>
  <circle cx="56" cy="45" r="1.6" fill="#1e293b"/>
  <circle cx="32" cy="58" r="2" fill="#00f0ff"/>

  <!-- Monogram S (Art & Warm Environment) -->
  <path d="M30 18 H17 L13 22 V27 L17 31 H26 L30 35 V42 L26 46 H13" 
        fill="none" stroke="url(#amber)" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Monogram R (Code & Graphics Shaders) -->
  <path d="M35.5 46 V18 H45 L49.5 22.5 V27.5 L45 32 H35.5 M43.5 32 L51 46" 
        fill="none" stroke="url(#cyan)" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Duality Core Sparkle / Node -->
  <circle cx="32.75" cy="31" r="1.6" fill="#ffffff"/>
</svg>